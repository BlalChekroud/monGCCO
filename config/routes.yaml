controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    
# Route personnalisée pour changer la langue
change_locale:
    path: /change-locale/{_locale}
    controller: App\Controller\HomeController::changeLocale
    requirements:
        _locale: '[a-zA-Z]{2}' #fr|en|ar  #'[a-zA-Z]{2}|AR'  Limitez les choix à 'en' et 'fr'

change_out:
    path: /change-out/{_locale}
    controller: App\Controller\HomeController::changeOut
    requirements:
        _locale: '[a-zA-Z]{2}'

