campaignGuide:
  title: "Guide des États d'une Campagne de Comptage"
  close: "Fermer"
  introductionTitle: "Introduction"
  introductionText: "Lors de la gestion des campagnes de comptage des oiseaux, une campagne peut traverser plusieurs états. Ces états permettent de suivre le cycle de vie d'une campagne, de sa planification à sa clôture ou annulation."
  differentStatesTitle: "Les différents états et leurs significations :"
  common:
    active: "Quand l'état est actif :"
    actions: "Actions possibles :"
  state:
    planned:
      title: "Planifiée"
      description: "La campagne est définie, mais n'a pas encore commencé."
      active_description: "La date de début de la campagne est dans le futur."
      actions_description: "L'utilisateur peut préparer les sites et les équipes, mais la collecte de données ne peut pas encore commencer."
    ongoing:
      title: "En cours"
      description: "La campagne est actuellement en cours de réalisation."
      active_description: "La date de début est atteinte, et la date de fin est encore à venir."
      actions_description: "Les collectes de données peuvent être réalisées par les équipes sur les sites assignés."
    finished:
      title: "Terminée"
      description: "La période de la campagne est terminée, mais elle n'est pas encore officiellement clôturée."
      active_description: "La date de fin de la campagne est passée, mais des vérifications finales peuvent être en attente."
      actions_description: "L'utilisateur peut examiner les données collectées avant de prendre des décisions finales."
    closed:
      title: "Clôturée"
      description: "La campagne est officiellement close."
      active_description: "Toutes les données ont été vérifiées et validées, aucune autre action n'est possible."
    suspended:
      title: "Suspendue"
      description: "La campagne est temporairement interrompue."
      active_description: "La campagne a été mise en pause pour une raison quelconque (conditions météorologiques, etc.)."
      actions_description: "La campagne peut être reprise ou annulée selon les circonstances."
    cancelled:
      title: "Annulée"
      description: "La campagne a été annulée avant d'être clôturée."
      active_description: "L'utilisateur ou un administrateur a décidé d'annuler la campagne."
      actions_description: "Aucune collecte de données supplémentaire ne peut être effectuée."
    error:
      title: "Erreur"
      description: "Un problème est survenu empêchant la réalisation correcte de la campagne."
      active_description: "Un problème technique ou organisationnel a empêché la campagne d'avancer."
  adviceTitle: "Conseils :"
  advice:
    close:
      title: "Clôturer une campagne :"
      description: "Assurez-vous que toutes les données sont collectées et validées avant de clôturer."
    resume:
      title: "Reprise d'une campagne suspendue :"
      description: "Elle peut être reprise une fois que les obstacles sont levés."
    cancel:
      title: "Annulation :"
      description: "Soyez prudent, une campagne annulée ne pourra pas être reprise."

