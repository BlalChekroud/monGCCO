campaignGuide:
  title: "Guide to Campaign Statuses for Bird Counting"
  close: "Close"
  introductionTitle: "Introduction"
  introductionText: "During the management of bird counting campaigns, a campaign can go through several statuses. These statuses allow tracking the life cycle of a campaign, from planning to closure or cancellation."
  differentStatesTitle: "The different statuses and their meanings:"
  common:
    active: "When the status is active:"
    actions: "Possible actions:"
  state:
    planned:
      title: "Planned"
      description: "The campaign is defined but has not yet started."
      active_description: "The campaign's start date is in the future."
      actions_description: "The user can prepare sites and teams, but data collection cannot yet begin."
    ongoing:
      title: "Ongoing"
      description: "The campaign is currently in progress."
      active_description: "The start date has been reached, and the end date is yet to come."
      actions_description: "Data collection can be carried out by teams at assigned sites."
    finished:
      title: "Finished"
      description: "The campaign period is over, but it has not been officially closed yet."
      active_description: "The campaign's end date has passed, but final checks may still be pending."
      actions_description: "The user can review the collected data before making final decisions."
    closed:
      title: "Closed"
      description: "The campaign is officially closed."
      active_description: "All data has been verified and validated, and no further action is possible."
    suspended:
      title: "Suspended"
      description: "The campaign is temporarily paused."
      active_description: "The campaign has been put on hold for some reason (e.g. weather conditions)."
      actions_description: "The campaign can be resumed or cancelled depending on the circumstances."
    cancelled:
      title: "Cancelled"
      description: "The campaign has been cancelled before closure."
      active_description: "The user or an administrator has decided to cancel the campaign."
      actions_description: "No further data collection can be performed."
    error:
      title: "Error"
      description: "An issue occurred preventing the campaign from proceeding correctly."
      active_description: "A technical or organizational problem prevented the campaign from progressing."
  adviceTitle: "Advice:"
  advice:
    close:
      title: "Closing a campaign:"
      description: "Make sure all data is collected and validated before closing."
    resume:
      title: "Resuming a suspended campaign:"
      description: "It can be resumed once obstacles are removed."
    cancel:
      title: "Cancellation:"
      description: "Be careful, a cancelled campaign cannot be resumed."

