    const COLLECTS_STORE = "collects";
    const METADATA_STORE = "metadata";
    const SYNC_TAG = "sync-collects";
    const container = document.getElementById("birdSpeciesCountsContainer");
    const addButton = document.querySelector(".add-item");
    let index = 0;
  
    // --- Banner dynamique online/offline ---
    function updateStatusBanner() {
      const banner = document.getElementById("status-banner");
      if (navigator.onLine) {
        banner.textContent = "✅ Vous êtes en ligne";
        banner.className = "online";
      } else {
        banner.textContent = "⚠️ Vous êtes hors ligne";
        banner.className = "offline";
      }
    }
    window.addEventListener("online", updateStatusBanner);
    window.addEventListener("offline", updateStatusBanner);
    updateStatusBanner();
  
    // --- IndexedDB ---
    async function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(COLLECTS_STORE)) {
            db.createObjectStore(COLLECTS_STORE, { keyPath: "id", autoIncrement: true });
          }
          if (!db.objectStoreNames.contains(METADATA_STORE)) {
            db.createObjectStore(METADATA_STORE, { keyPath: "url" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
  
    async function putCollect(record) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(COLLECTS_STORE, "readwrite");
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.objectStore(COLLECTS_STORE).add(record);
      });
    }
  
    async function getMetadata(url) {
      const db = await openDb();
      const tx = db.transaction(METADATA_STORE, "readonly");
      const store = tx.objectStore(METADATA_STORE);
      return new Promise((resolve) => {
        const req = store.get(url);
        req.onsuccess = () => resolve(req.result ? req.result.data : []);
        req.onerror = () => resolve([]);
      });
    }
  
    // Charger metadata (SWR : cache IndexedDB si offline, fetch sinon)
    async function fetchAndFill(url, targetSelect, labelField = "label", valueField = "id") {
      let data = [];
      try {
        const res = await fetch(url);
        data = await res.json();
      } catch (e) {
        console.warn("⚠️ Offline, lecture depuis IndexedDB pour", url);
        data = await getMetadata(url);
      }
  
      // remplir le select
      targetSelect.innerHTML = `<option value="">-- Choisir --</option>`;
      data.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item[valueField];
        opt.textContent = item[labelField];
        targetSelect.appendChild(opt);
      });
  
      return data;
    }
  
    async function populateSelects() {
      // Campagnes
      const campaigns = await fetchAndFill(
        "/api/metadata/campaigns",
        document.getElementById("campaignId"),
        "campaignName",
        "id"
      );
      const campaignSelect = document.getElementById("campaignId");
      campaignSelect.querySelectorAll("option").forEach((opt, i) => {
        if (i > 0) opt.dataset.sites = JSON.stringify(campaigns[i - 1].sites || []);
      });
  
      // Espèces
      window.cachedSpecies = await fetchAndFill(
        "/api/metadata/species",
        document.createElement("select"),
        "scientificName",
        "frenchName",
        "id"
      );
  
      // Types
      await fetchAndFill("/api/metadata/countType", document.getElementById("countType"));
  
      // Qualités
      await fetchAndFill("/api/metadata/quality", document.getElementById("quality"));
  
      // Méthodes
      await fetchAndFill("/api/metadata/method", document.getElementById("method"));
    }
  
    // Quand on change de campagne -> maj des sites
    document.getElementById("campaignId").addEventListener("change", (e) => {
      const selected = e.target.selectedOptions[0];
      const sites = selected ? JSON.parse(selected.dataset.sites || "[]") : [];
      const siteSelect = document.getElementById("siteId");
      siteSelect.innerHTML = '<option value="">-- Choisir un site --</option>';
      sites.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.siteName;
        siteSelect.appendChild(opt);
      });
    });
  
    // Espèces observées
    function addBirdSpeciesRow() {
      const row = document.createElement("div");
      row.classList.add("row", "mb-3", "birdSpeciesCountsContainer-item");
  
      let speciesOptions = `<option value="">-- Espèce --</option>`;
      (window.cachedSpecies || []).forEach(sp => {
        speciesOptions += `<option value="${sp.id}">${sp.scientificName} (${sp.frenchName})</option>`;
      });
  
      row.innerHTML = `
        <div class="col-sm-5">
          <select name="birdSpeciesCounts[${index}][birdSpeciesId]" class="form-select shadow-sm" required>
            ${speciesOptions}
          </select>
        </div>
        <div class="col-sm-3">
          <div class="input-group">
            <button type="button" class="btn btn-outline-secondary decreaseButton" data-target="count-${index}">-</button>
            <input type="number" id="count-${index}" name="birdSpeciesCounts[${index}][count]" value="0" class="form-control text-center">
            <button type="button" class="btn btn-outline-secondary increaseButton" data-target="count-${index}">+</button>
          </div>
        </div>
        <div class="col-sm-3">
          <button type="button" class="btn btn-danger remove-birdSpeciesCount">🗑</button>
        </div>
      `;
      container.appendChild(row);
  
      row.querySelector(".increaseButton").addEventListener("click", () => {
        const input = row.querySelector(`#count-${index}`);
        input.value = parseInt(input.value) + 1;
      });
      row.querySelector(".decreaseButton").addEventListener("click", () => {
        const input = row.querySelector(`#count-${index}`);
        input.value = Math.max(0, parseInt(input.value) - 1);
      });
      row.querySelector(".remove-birdSpeciesCount").addEventListener("click", () => row.remove());
  
      index++;
    }
    addButton.addEventListener("click", addBirdSpeciesRow);
  
  // 📌 Fonction pour formater une date en 'd-m-Y H:i:s'
  function formatDate(date) {
    const pad = (n) => n.toString().padStart(2, "0");
    return (
      pad(date.getDate()) + "-" +
      pad(date.getMonth() + 1) + "-" +
      date.getFullYear() + " " +
      pad(date.getHours()) + ":" +
      pad(date.getMinutes()) + ":" +
      pad(date.getSeconds())
    );
  }

  // Serialize form
  function serializeForm(form) {
    const birdSpeciesCounts = [];
    form.querySelectorAll(".birdSpeciesCountsContainer-item").forEach(row => {
      const birdSpeciesId = row.querySelector("select").value;
      const count = parseInt(row.querySelector("input[type=number]").value || "0", 10);
      if (birdSpeciesId && count > 0) {
        birdSpeciesCounts.push({ birdSpeciesId, count });
      }
    });

    return {
      campaignId: form.campaignId.value,
      siteId: form.siteId.value,
      countType: form.countType.value,
      quality: form.quality.value,
      method: form.method.value,
      birdSpeciesCounts,
      createdAt: formatDate(new Date()) // ⬅️ format d-m-Y H:i:s
    };
  }

  
    // Submit
    document.getElementById("offline-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = serializeForm(e.target);
  
      await putCollect({ payload });
  
      // informer le SW pour synchronisation
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: "ADD_COLLECT",
          collect: payload
        });
      }
  
      alert("📦 Collecte sauvegardée hors ligne. Elle sera envoyée automatiquement quand vous serez en ligne.");
      e.target.reset();
  
      if ("serviceWorker" in navigator && "SyncManager" in window) {
        const reg = await navigator.serviceWorker.ready;
        await reg.sync.register(SYNC_TAG);
      }
    });
  
    document.addEventListener("DOMContentLoaded", populateSelects);
  </script>
  
</body>
</html>
