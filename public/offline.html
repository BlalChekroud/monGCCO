<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire hors ligne</title>
    <script src="/js/db.js" defer></script>
    <script src="/js/form-handler.js" defer></script>
    <script src="/js/sync.js" defer></script>
</head>
<body>
    <form>
        <label for="siteCollection">Site :</label>
        <input type="text" id="siteCollection" name="siteCollection" required><br>

        <label for="weatherEffect">Effet météo :</label>
        <input type="text" id="weatherEffect" name="weatherEffect" required><br>

        <label for="waterState">État de l'eau :</label>
        <input type="text" id="waterState" name="waterState" required><br>

        <label for="quality">Qualité :</label>
        <input type="text" id="quality" name="quality" required><br>

        <label for="method">Méthode :</label>
        <input type="text" id="method" name="method" required><br>

        <div class="specy-group">
            <label>Espèce :</label>
            <input type="text" class="specy" required>
            <label>Nombre :</label>
            <input type="number" class="count" required>
        </div>
        
        <button type="submit">Soumettre</button>
    </form>
</body>
</html>
